<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lession 2</title>

    <style>
        form .basic input {
            display: block;
            margin-bottom: 6px;
        }

        table {
            border-collapse: collapse;
            border: 1px solid black;
            margin-top: 20px;
        }

        td,
        th {
            border: 1px solid black;
            padding: 10px 20px;
        }

        .first-container {
            display: flex;
            margin-top: 20px;
        }

        .second-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .third-container {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            margin-top: 20px
        }

        .first-container div,
        .second-container div,
        .third-container div {
            font-size: 5em;
            width: 200px;
            height: 200px;
            border: 1px solid black;
        }
    </style>
</head>

<body>
    <!-- header -->
    <header>
        <h2 style="text-align: center;">Audio & Video</h2>
    </header>

    <!-- main content -->
    <main>
        <section>
            <!-- audio -->
            <audio controls>
                <source src="./media/tense piano.mp3" type="audio/mpeg">
            </audio>
        </section>

        <section>
            <!-- video -->
            <video controls style="width: 60%; height: 60%;">
                <source src="./media/stock.mp4" type="video/mp4">
            </video>
        </section>

        <section>
            <!-- iframe -->
            <iframe width="560" height="315" src="https://www.youtube.com/embed/mYNHKXfgNC4?si=44WTvOEk-_v3ths0"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </section>

        <figure>
            <!-- image -->
            <img src="./media/2027_(2).jpg" alt="2027 coming image" style="width: 50%; height: 40%;">
            <figurecaption>2027 coming image</figurecaption>
        </figure>

        <section>
            <!-- form -->
            <h2>form</h2>
            <form>
                <fieldset class="basic">
                    <legend>Basic info</legend>

                    <label for="name">Name</label>
                    <input type="text" name="" id="name">

                    <label for="email">Email</label>
                    <input type="email" name="" id="email">
                </fieldset>

                <fieldset>
                    <legend>Pitha info</legend>

                    <input type="radio" name="ptha" id="chitoy">
                    <label for="chitoy">Chitoy</label>

                    <input type="radio" name="ptha" id="vapa">
                    <label for="vapa">Vapa</label>

                    <input type="radio" name="ptha" id="rice">
                    <label for="rice">Rice cake</label>
                </fieldset>

                <fieldset>
                    <legend>Vorta info</legend>

                    <input type="checkbox" name="vorta" id="shorisha">
                    <label for="shorisha">Shorisha</label>

                    <input type="checkbox" name="vorta" id="shutki">
                    <label for="shutki">Shutkia</label>

                    <input type="checkbox" name="vorta" id="morich">
                    <label for="morich">Morich</label>
                </fieldset>

                <fieldset>
                    <legend>Feedback</legend>
                    <textarea cols="50" rows="6" id=""></textarea>
                </fieldset>
            </form>
        </section>

        <section>
            <!-- table -->
            <table>
                <caption>School present sheet</caption>

                <thead>
                    <tr>
                        <td>index</td>
                        <td>name</td>
                        <td>roll</td>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Sifad</td>
                        <td>261178</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Saiful</td>
                        <td>261179</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>Juthi</td>
                        <td>261180</td>
                    </tr>
                </tbody>

                <tfoot>
                    <tr>
                        <td colspan="3">Total student: 03</td>
                    </tr>
                </tfoot>
            </table>
        </section>

        <section>
            <!-- container -->
            <div class="first-container">
                <div>1</div>
                <div>2</div>
                <div>3</div>
                <div>4</div>
                <div>5</div>
            </div>

            <div class="second-container">
                <div>1</div>
                <div>2</div>
                <div>3</div>
                <div>4</div>
                <div>5</div>
            </div>

            <div class="third-container">
                <div>1</div>
                <div>2</div>
                <div>3</div>
                <div>4</div>
                <div>5</div>
                <div>6</div>
                <div>7</div>
                <div>8</div>
                <div>9</div>
                <div>10</div>
            </div>
        </section>
    </main>

    <!-- footer -->
    <footer style="text-align: center; margin-top: 20px;">
        <small>Copyright &copy; 2024</small>
    </footer>

</html>
